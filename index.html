<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090b">
<meta name="description" content="寂生 · Allothiri">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%2308090b'/%3E%3Ccircle cx='32' cy='32' r='15' fill='none' stroke='%23deddd8' stroke-width='2'/%3E%3Ccircle cx='32' cy='32' r='3' fill='%237d2023'/%3E%3C/svg%3E">
<title>寂生 · Allothiri</title>
<style>
:root {
  --black: #08090b;
  --black-soft: #0d0f12;
  --paper: #deddd8;
  --paper-dim: rgba(222, 221, 216, .62);
  --paper-faint: rgba(222, 221, 216, .18);
  --paper-ghost: rgba(222, 221, 216, .07);
  --red: #7d2023;
  --red-bright: #b83b3f;
  --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", SimSun, serif;
  --kai: KaiTi, STKaiti, "楷体", serif;
  --latin: "Bodoni 72", Didot, Georgia, serif;
  --ease: cubic-bezier(.19, 1, .22, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--black); color-scheme: dark; }
body {
  min-height: 100vh;
  min-height: 100dvh;
  overflow: hidden;
  background: var(--black);
  color: var(--paper);
  font-family: var(--serif);
  font-weight: 300;
  letter-spacing: .08em;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

button, a { color: inherit; font: inherit; }
button { border: 0; }
a { text-decoration: none; }

.noise, .vignette {
  position: fixed;
  inset: 0;
  pointer-events: none;
}
.noise {
  z-index: 800;
  opacity: .055;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
  animation: grain .7s steps(2) infinite;
  mix-blend-mode: soft-light;
}
.vignette {
  z-index: 790;
  background: radial-gradient(circle at 50% 44%, transparent 28%, rgba(0, 0, 0, .35) 68%, rgba(0, 0, 0, .84) 100%);
}
@keyframes grain {
  0% { transform: translate(0, 0); }
  25% { transform: translate(-1.5%, 1%); }
  50% { transform: translate(1%, -1.5%); }
  75% { transform: translate(1.5%, 1%); }
  100% { transform: translate(0, 0); }
}

/* 封面书本 */
.cover {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: grid;
  place-items: center;
  overflow: hidden;
  cursor: pointer;
  background: #050506;
  transition: opacity 1.4s ease, visibility 1.4s;
}
.cover::before {
  content: "";
  position: absolute;
  inset: -5%;
  background: linear-gradient(rgba(0,0,0,.5), rgba(0,0,0,.8)), url("assets/dustbound-notebook.png") center / cover;
  filter: blur(20px) brightness(.5) contrast(1.08);
  transform: scale(1.08);
  transition: transform 2.2s var(--ease), filter 2.2s ease;
}
.cover::after { content: ""; position: absolute; inset: 0; z-index: 1; background: radial-gradient(ellipse at 50% 48%, transparent 28%, rgba(0,0,0,.78) 100%); pointer-events: none; }
.cover.is-open { opacity: 0; visibility: hidden; pointer-events: none; }
.cover-poster {
  position: relative;
  z-index: 3;
  width: min(100%, 900px);
  height: 100%;
  object-fit: contain;
  filter: contrast(1.06) brightness(.94);
  box-shadow: 0 0 90px rgba(0,0,0,.92);
  transform: scale(1.01);
  transition: transform 1.45s var(--ease), filter 1.45s ease, opacity 1.1s ease;
}
.cover:hover .cover-poster { transform: scale(1.025); filter: contrast(1.1) brightness(1.03); }
.cover.is-opening::before { transform: scale(1.16); filter: blur(24px) brightness(.34); }
.cover.is-opening .cover-poster { opacity: 0; transform: scale(1.09) rotate(-1deg); filter: contrast(1.15) brightness(1.18) blur(2px); }
.cover-prompt {
  position: absolute;
  z-index: 12;
  left: 50%;
  bottom: max(28px, calc(18px + env(safe-area-inset-bottom)));
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 16px;
  white-space: nowrap;
  color: rgba(255, 255, 255, .58);
  font-size: 11px;
  letter-spacing: .52em;
  text-indent: .52em;
  animation: breathe 2.8s ease-in-out infinite;
  transition: opacity .45s ease;
}
.cover.is-opening .cover-prompt { opacity: 0; }
.cover-prompt::before, .cover-prompt::after { content: ""; width: 38px; height: 1px; background: rgba(255,255,255,.25); }
@keyframes breathe { 50% { opacity: .35; } }

/* ========== 序章动画 总时长4秒 ========== */
.opening-wrap{
  position:fixed;
  inset:0;
  z-index:900;
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:flex-end;
  padding-right:12%;
  background:#050506;
  opacity:0;
  pointer-events:none;
}
.opening-wrap.active{
  opacity:1;
  pointer-events:auto;
}
.opening-title{
  display:flex;
  align-items:center;
  gap:14px;
  font-family: var(--kai);
  font-size: clamp(42px,6vw,72px);
  letter-spacing:.14em;
  color:#ffffff;
  opacity:0;
  transform:translateY(20px);
  animation:rise 1s var(--ease) forwards;
  animation-delay:0.3s;
}
.opening-en{
  margin-top:20px;
  font: italic 14px/1 var(--latin);
  letter-spacing:.32em;
  color:#ffffff;
  opacity:0;
  transform:translateY(20px);
  animation:rise 1s var(--ease) forwards;
  animation-delay:1.4s;
}
.opening-note{
  margin-top:30px;
  font-family: var(--kai);
  font-size: clamp(24px,3vw,36px);
  letter-spacing:.14em;
  color:#b83b3f;
  opacity:0;
  transform:translateY(20px);
  animation:rise 1s var(--ease) forwards;
  animation-delay:2.5s;
}
@keyframes rise { to { opacity: 1; transform: translateY(0); } }

/* 主页面内容 默认隐藏，等序章4秒全部结束才显示 */
.main-container{
  opacity:0;
  visibility:hidden;
  transition:opacity 1.2s ease, visibility 1.2s;
}
.main-container.show{
  opacity:1;
  visibility:visible;
}

/* 全局导航 */
.topbar {
  position: fixed;
  z-index: 900;
  top: 0;
  left: 0;
  right: 0;
  height: 84px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 48px;
  opacity: 0;
  transform: translateY(-12px);
  transition: opacity 1.2s ease .3s, transform 1.2s var(--ease) .3s;
  pointer-events: none;
}
.main-container.show .topbar { opacity: 1; transform: none; pointer-events: auto; }
.brand { display: flex; align-items: baseline; gap: 12px; }
.brand-en { color: var(--paper); font: italic 14px/1 var(--latin); letter-spacing: .32em; }
.nav { display: flex; align-items: center; gap: 3px; padding: 4px; border: 1px solid var(--paper-faint); border-radius: 999px; background: rgba(8, 9, 11, .68); backdrop-filter: blur(14px); }
.nav button {
  min-width: 74px;
  padding: 8px 13px;
  border-radius: 999px;
  background: transparent;
  color: var(--paper-dim);
  font-size: 12px;
  letter-spacing: .26em;
  text-indent: .26em;
  cursor: pointer;
  transition: color .5s ease, background .5s ease;
}
.nav button:hover { color: var(--paper); }
.nav button.is-on { color: var(--paper); background: rgba(255, 255, 255, .1); }

.folio {
  position: fixed;
  z-index: 900;
  left: 48px;
  bottom: 30px;
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--paper-dim);
  font: italic 12px/1 var(--latin);
  letter-spacing: .2em;
  opacity: 0;
  transition: opacity 1.2s ease .45s;
}
.main-container.show .folio { opacity: 1; }
.folio-current { color: var(--paper); font-size: 17px; }
.folio-line { width: 46px; height: 1px; background: var(--paper-faint); }
.pager {
  position: fixed;
  z-index: 900;
  right: 48px;
  bottom: 24px;
  display: flex;
  gap: 8px;
  opacity: 0;
  transition: opacity 1.2s ease .45s;
}
.main-container.show .pager { opacity: 1; }
.pager button {
  width: 44px;
  height: 44px;
  border: 1px solid var(--paper-faint);
  border-radius: 50%;
  background: rgba(8, 9, 11, .56);
  color: var(--paper-dim);
  cursor: pointer;
  transition: border-color .4s ease, color .4s ease, transform .4s var(--ease);
}
.pager button:not(:disabled):hover { color: var(--paper); border-color: var(--paper-dim); transform: scale(1.06); }
.pager button:disabled { opacity: .25; cursor: default; }

/* 页面 */
.stage { position: fixed; inset: 0; z-index: 5; opacity: 0; transition: opacity 1.3s ease .2s; }
.main-container.show .stage { opacity: 1; }
.page {
  position: absolute;
  inset: 0;
  overflow-x: hidden;
  overflow-y: auto;
  scrollbar-width: none;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity .8s ease, visibility .8s;
}
.page::-webkit-scrollbar { display: none; }
.page.is-on { opacity: 1; visibility: visible; pointer-events: auto; }
.page-inner {
  position: relative;
  z-index: 10;
  width: min(1180px, calc(100% - 144px));
  min-height: 100%;
  margin: 0 auto;
  padding: 128px 0 112px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.eyebrow { display: flex; align-items: center; gap: 14px; margin-bottom: 34px; color: var(--paper-dim); font: italic 12px/1 var(--latin); letter-spacing: .28em; text-transform: uppercase; }
.eyebrow::before { content: ""; width: 32px; height: 1px; background: var(--red-bright); }
.page-title { font-family: var(--kai); font-size: clamp(48px, 7vw, 100px); font-weight: 400; line-height: .9; letter-spacing: .08em; }
.page-title small { display: block; margin-top: 24px; color: var(--paper-dim); font: italic 12px/1 var(--latin); letter-spacing: .58em; text-transform: uppercase; }
.reveal { opacity: 0; transform: translateY(22px); }
.page.is-on .reveal { animation: rise 1.25s var(--ease) forwards; animation-delay: var(--delay, .1s); }
.material {
  position: absolute;
  z-index: 3;
  display: block;
  pointer-events: none;
  user-select: none;
  filter: grayscale(1) contrast(1.08);
  mix-blend-mode: screen;
}
.material-profile { right: -7%; bottom: -15%; width: min(46vw, 680px); opacity: .12; transform: rotate(-14deg); }
.material-notice { right: -8%; top: 2%; width: min(38vw, 560px); opacity: .09; transform: rotate(20deg); }
.material-story { left: -8%; bottom: -18%; width: min(44vw, 650px); opacity: .12; transform: rotate(12deg); }

/* 序章页面 */
.prologue { background: #07080a; }
.prologue-bg {
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, rgba(4, 5, 7, .18), rgba(4, 5, 7, .82) 68%, #07080a), url("assets/black-tide.png") center / cover;
  filter: grayscale(1) contrast(1.12) brightness(.72);
  transform: scale(1.025);
}
.prologue .page-inner { align-items: flex-end; text-align: right; }
.prologue-copy { width: min(680px, 78%); position: relative; }

/* 人物 */
.profile { background: radial-gradient(circle at 18% 25%, #15171a 0%, #0a0b0d 44%, #07080a 100%); }
.profile-grid { display: grid; grid-template-columns: .9fr 1.1fr; gap:60px; align-items:center; }
</style>
</head>
<body>
<!-- 封面书本 -->
<div class="cover" id="cover">
  <img class="cover-poster" src="assets/dustbound-notebook.png" alt="书本封面">
  <div class="cover-prompt">点击翻开</div>
</div>

<!-- 序章开场动画 -->
<div class="opening-wrap" id="openingAnim">
  <div class="opening-title">
    <span class="opening-dot">●</span>
    <span class="opening-text">序章</span>
  </div>
  <p class="opening-en">Allothiri</p>
  <p class="opening-note">死无葬身之地</p>
</div>

<!-- 主页面容器（序章播完才显示） -->
<div class="main-container" id="mainContainer">
  <div class="noise"></div>
  <div class="vignette"></div>

  <!-- 顶部导航 -->
  <div class="topbar">
    <div class="brand">
      <div class="brand-en">Allothiri</div>
    </div>
    <div class="nav">
      <button class="is-on" data-page="prologue">序章</button>
      <button data-page="profile">人物</button>
    </div>
  </div>

  <div class="folio">
    <span class="folio-current">01</span>
    <span class="folio-line"></span>
    <span>Allothiri</span>
  </div>

  <div class="pager">
    <button id="prevBtn" disabled>&lt;</button>
    <button id="nextBtn">&gt;</button>
  </div>

  <div class="stage">
    <!-- 序章主页面 -->
    <div class="page prologue is-on" id="prologue">
      <div class="prologue-bg"></div>
      <div class="page-inner">
        <div class="prologue-copy">
          <div class="eyebrow"><span>01</span></div>
          <h1 class="page-title">序章<small>Allothiri</small></h1>
        </div>
      </div>
    </div>

    <!-- 人物页面 -->
    <div class="page profile" id="profile">
      <div class="page-inner">
        <div class="profile-grid">
          <div>
            <div class="eyebrow"><span>02</span></div>
            <h1 class="page-title">人物</h1>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const cover = document.getElementById('cover');
const openingAnim = document.getElementById('openingAnim');
const mainContainer = document.getElementById('mainContainer');
// 序章总时长4秒
const openingTotalTime = 4000;

cover.addEventListener('click', ()=>{
  cover.classList.add('is-opening');
  setTimeout(()=>{
    cover.classList.add('is-open');
    openingAnim.classList.add('active');
    // 4秒序章动画结束后，显示主页面
    setTimeout(()=>{
      openingAnim.style.opacity = 0;
      openingAnim.style.pointerEvents = "none";
      mainContainer.classList.add('show');
    }, openingTotalTime);
  }, 500);
})

// 页面切换逻辑
const pages = document.querySelectorAll('.page');
const navBtns = document.querySelectorAll('.nav button');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
let currentPageIndex = 0;

function switchPage(index){
  pages.forEach(p=>p.classList.remove('is-on'));
  pages[index].classList.add('is-on');
  navBtns.forEach(b=>b.classList.remove('is-on'));
  navBtns[index].classList.add('is-on');
  currentPageIndex = index;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === pages.length -1;
}

navBtns.forEach((btn,i)=>{
  btn.addEventListener('click', ()=>{
    switchPage(i);
  })
})
prevBtn.onclick = ()=> switchPage(currentPageIndex -1);
nextBtn.onclick = ()=> switchPage(currentPageIndex +1);
</script>
</body>
</html>
